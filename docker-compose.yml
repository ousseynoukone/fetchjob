services:
  postgres:
    # Matches the production Neon database's own version (18) — kept in sync
    # on purpose so a local dump/restore of prod data never hits a
    # server-version mismatch, and local testing behaves the same as prod.
    image: postgres:18-alpine
    container_name: findurjob_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: findurjob
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: findurjob
    ports:
      - '5432:5432'
    # Postgres 18's own image mounts the parent dir, not .../data directly
    # (it places versioned subdirectories itself) — confirmed live, the old
    # .../data mount point made the image refuse to start.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U findurjob -d findurjob']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: findurjob_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: findurjob_api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://findurjob:${DATABASE_PASSWORD:-password}@postgres:5432/findurjob?schema=public
      # Neon needs separate pooled/direct connections (schema.prisma); the
      # local single-instance Postgres here has no pooler, so both point at
      # the exact same place.
      - DIRECT_DATABASE_URL=postgresql://findurjob:${DATABASE_PASSWORD:-password}@postgres:5432/findurjob?schema=public
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3001
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-your-super-secret-refresh-token-key-change-in-production}
      - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN:-7d}
      # Required — CryptoService throws at boot without it (encrypts stored
      # platform credentials/sessions). Generate with `openssl rand -base64 32`.
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - FRANCE_TRAVAIL_CLIENT_ID=${FRANCE_TRAVAIL_CLIENT_ID:-}
      - FRANCE_TRAVAIL_CLIENT_SECRET=${FRANCE_TRAVAIL_CLIENT_SECRET:-}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID:-}
      - ADZUNA_API_KEY=${ADZUNA_API_KEY:-}
      # Same headless default as production (see render.yaml) — no display
      # exists inside the container anyway.
      - AUTO_APPLY_HEADLESS=${AUTO_APPLY_HEADLESS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: findurjob_web
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: findurjob_network
