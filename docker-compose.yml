services:
  # TEMPORARY local fallback (2026-10-05) -- Neon's free-tier monthly network
  # transfer allowance (5GB) is exhausted (confirmed via Neon's own API:
  # HTTP 402 "account or project has exceeded the quota"), blocking all
  # connections until it resets 2026-11-01 or the plan is upgraded. Restored
  # so the app keeps working meanwhile; data written here is LOCAL ONLY and
  # will need reconciling with Neon once it's reachable again. Remove this
  # service (and point DATABASE_URL/DIRECT_DATABASE_URL back at Neon in
  # .env) once that happens -- see git history for the exact prior values.
  postgres:
    image: postgres:18-alpine
    container_name: findurjob_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: findurjob
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: findurjob
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U findurjob -d findurjob']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: findurjob_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: findurjob_api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      # Shared live Neon database (see root .env) — read from the host's .env
      # so Docker, local npm, and Mac runs all point at the exact same data.
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_DATABASE_URL=${DIRECT_DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3001
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-your-super-secret-refresh-token-key-change-in-production}
      - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN:-7d}
      # Required — CryptoService throws at boot without it (encrypts stored
      # platform credentials/sessions). Generate with `openssl rand -base64 32`.
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - FRANCE_TRAVAIL_CLIENT_ID=${FRANCE_TRAVAIL_CLIENT_ID:-}
      - FRANCE_TRAVAIL_CLIENT_SECRET=${FRANCE_TRAVAIL_CLIENT_SECRET:-}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID:-}
      - ADZUNA_API_KEY=${ADZUNA_API_KEY:-}
      # Same headless default as production (see render.yaml). When
      # BROWSER_CDP_URL is empty (no host Chrome) and this is "false", the
      # container's own entrypoint (docker-entrypoint.sh) starts Xvfb so
      # Chromium has a display to open a window on -- still no real GPU
      # though, so this trades a headless fingerprint for a software-GPU one
      # rather than a genuinely undetectable one; the host Chrome path
      # remains the only way to get a real hardware fingerprint.
      - AUTO_APPLY_HEADLESS=${AUTO_APPLY_HEADLESS:-true}
      # Drive a REAL desktop Chrome on the host instead of launching one in
      # here -- see apps/api/src/common/cdp-endpoint.ts. The host Chrome is
      # started separately (start-host-chrome.ps1) with --remote-debugging-
      # port=9222; Docker Desktop routes host.docker.internal to the host
      # loopback, so no port forwarding is needed. Bare `-` (not `:-`) so
      # setting this to an explicitly empty value in .env.local actually
      # falls through to launching a Chromium inside the container instead
      # of always retrying the host Chrome URL.
      - BROWSER_CDP_URL=${BROWSER_CDP_URL-http://host.docker.internal:9222}
      # Render caps this at 160 to fit its 512MB container — confirmed live
      # that this same limit can crash the renderer outright on a heavy page
      # (LinkedIn's Easy Apply modal) even locally, where there's no such
      # constraint. Defaults much higher here since local Docker Desktop
      # typically has several GB available.
      - CHROMIUM_RENDERER_HEAP_MB=${CHROMIUM_RENDERER_HEAP_MB:-1024}
    # host.docker.internal is a Docker Desktop (Mac/Windows) built-in; on a
    # native Linux Docker Engine (e.g. a headless Linux server) it doesn't
    # resolve at all unless mapped explicitly, which is what this does
    # (Docker 20.10+). Harmless no-op on Docker Desktop, where the name
    # already resolves on its own.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # Backs remote-login.service.ts's persistent per-platform Chrome
    # profiles -- without this, the container's own filesystem is wiped on
    # every rebuild, and a brand-new, zero-history browser profile on every
    # single login attempt is itself a real signal to a platform's own
    # fraud detection (a real person's browser accumulates cookies/cache
    # from years of ordinary use; this at least lets it accumulate across
    # restarts instead of starting from nothing every time).
    # Backs stealth-browser.ts's per-site scraping Chrome profiles for the
    # same reason (see createStealthContext / SCRAPING_PROFILE_BASE_DIR):
    # confirmed live that a genuinely persistent profile is what closed most
    # of the gap between the in-container scraper and the host Chrome for
    # sites that check for it (Indeed's Cloudflare WAF scraped 0 offers
    # in-container before this, 80 via host Chrome).
    volumes:
      - remote_login_profiles:/root/.findurjob/remote-login-profiles
      - scraping_profiles:/root/.findurjob/scraping-profiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: findurjob_web
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    # No depends_on: api. The API runs as a LOCAL process, not a container
    # (a containerized browser trips anti-bot detection far more than a real
    # desktop one), and the frontend reaches it from the browser via
    # localhost:4000 -- nothing here needs the api container. Declaring the
    # dependency made every `docker compose up web` silently resurrect the
    # containerized API alongside the local one: two instances hitting the
    # same DB, running duplicate session keep-alives against every platform,
    # and fighting over port 4000.

volumes:
  postgres_data:
  redis_data:
  remote_login_profiles:
  scraping_profiles:

networks:
  default:
    name: findurjob_network
